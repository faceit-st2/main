<!DOCTYPE html>
<html lang="ru" ng-app="mahjongg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHEMK — Маджонг Древних</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <style>
    @font-face {
      font-family: "Akedopikuseru";
      src: url("Akedopikuseru-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    body {
      background: radial-gradient(circle at 10% 10%, rgba(76, 255, 112, 0.14), transparent 18%),
        radial-gradient(circle at 85% 15%, rgba(0, 255, 128, 0.08), transparent 12%),
        linear-gradient(180deg, #061206 0%, #020402 100%);
      text-align: center;
      margin: 0;
      font-family: "Akedopikuseru", sans-serif;
      color: #c8f8b2;
    }

    #game {
      position: relative;
      width: 640px;
      height: 480px;
      margin: auto;
    }

    .tile {
      position: absolute;
      display: block;
      border: 1px solid #000;
      border-radius: 5px;
      width: 36px;
      height: 48px;
      background: #fff;
      box-shadow: 5px 5px 10px #000;
      background-image: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/52785/tiles.png');
      background-repeat: no-repeat;
    }

    .tile.clickable:hover {
      box-shadow: 5px 5px 10px #000, 0 0 14px #000;
    }

    .selected, .selected:hover {
      box-shadow: inset 0 0 14px #000, 0 0 14px #000, 5px 5px 10px #000;
    }

    .tile.tile-1 { background-position: 0px 0px; }
    .tile.tile-2 { background-position: -36px 0px; }
    .tile.tile-3 { background-position: -72px 0px; }
    .tile.tile-4 { background-position: 0px -48px; }
    .tile.tile-5 { background-position: -36px -48px; }
    .tile.tile-6 { background-position: -72px -48px; }
    .tile.tile-7 { background-position: -108px 0px; }
    .tile.tile-8 { background-position: -108px -48px; }
    .tile.tile-9 { background-position: 0px -96px; }
    .tile.tile-10 { background-position: -36px -96px; }
    .tile.tile-11 { background-position: -72px -96px; }
    .tile.tile-12 { background-position: -108px -96px; }
    .tile.tile-13 { background-position: -144px 0px; }
    .tile.tile-14 { background-position: -144px -48px; }
    .tile.tile-15 { background-position: -144px -96px; }
    .tile.tile-16 { background-position: -180px 0px; }
    .tile.tile-17 { background-position: -180px -48px; }
    .tile.tile-18 { background-position: -180px -96px; }
    .tile.tile-19 { background-position: 0px -144px; }
    .tile.tile-20 { background-position: -36px -144px; }
    .tile.tile-21 { background-position: -72px -144px; }
    .tile.tile-22 { background-position: -108px -144px; }
    .tile.tile-23 { background-position: -144px -144px; }
    .tile.tile-24 { background-position: -180px -144px; }
    .tile.tile-25 { background-position: -216px 0px; }
    .tile.tile-26 { background-position: -216px -48px; }
    .tile.tile-27 { background-position: -216px -96px; }
    .tile.tile-28 { background-position: -216px -144px; }
    .tile.tile-29 { background-position: 0px -192px; }
    .tile.tile-30 { background-position: -36px -192px; }
    .tile.tile-31 { background-position: -72px -192px; }
    .tile.tile-32 { background-position: -108px -192px; }
    .tile.tile-33 { background-position: -144px -192px; }
    .tile.tile-34 { background-position: -180px -192px; }
    .tile.tile-35 { background-position: -216px -192px; }
    .tile.tile-36 { background-position: -252px 0px; }
    .tile.tile-37 { background-position: -252px -48px; }
    .tile.tile-38 { background-position: -252px -96px; }
    .tile.tile-39 { background-position: -252px -144px; }
    .tile.tile-40 { background-position: -252px -192px; }
    .tile.tile-41 { background-position: 0px -240px; }
    .tile.tile-42 { background-position: -36px -240px; }

    .copy {
      background: #414042;
      box-shadow: 0 0 1px #633a26;
      color: #adafb3;
      font-family: 'Kameron', serif;
      font-size: 1rem;
      left: 0;
      margin: 0;
      padding: 6px 0;
      position: fixed;
      text-align: center;
      text-transform: uppercase;
      width: 100%;
      z-index: 10;
    }

    .instructions {
      bottom: 0;
      font-size: 1rem;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(0,0,0,0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      z-index: 20;
    }

    .top-bar a {
      color: #63ff82;
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      background: rgba(0,0,0,0.2);
    }

    .top-bar h1 {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 0;
      color: #9eff8f;
    }

    body { padding-top: 60px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Маджонг Древних</h1>
    <a href="Files.html">Назад</a>
  </div>
  <div id="game">
    <div ng-init="initialize()" ng-controller="BoardController">
      <span
        ng-style="{
          left: 50 + 18 * tile.position.x+'px',
          top:  48 + 24 * tile.position.y+'px',
          'z-index': 2 * tile.position.z + 1,
          cursor: isClickable?'pointer':'auto'
        }"
        class="tile tile-{{tile.tile}}"
        ng-class="{
          clickable:isClickable,
          selected:isSelected}"
        ng-controller="TileController"
        ng-repeat="tile in tiles"
        ng-click="clickTile()"></span>
      <h1 ng-if="tiles.length === 0" style="position:absolute; top: 50%; left:50%; transform: translate(-50%, -50%); color:#000; font-size:2rem;">You won!</h1>
      <button ng-click="initialize()" style="position:absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border:none; border-radius:10px; background:#333; color:#fff; cursor:pointer;">New Game</button>
    </div>
  </div>
  <div class="copy">MAHJONG</div>
  <p class="copy instructions">Flick to shoot - Click/Touch and drag to move the ball</p>
  <script>
    angular.module('mahjongg',[])
    .controller('TileController', ['$scope', ($scope) => {
      var item = $scope.tile;
      $scope.isSelected  = false;
      $scope.isClickable = $scope.$parent.isTileFree(item);
      $scope.clickTile = () => {
        if($scope.isClickable){
          $scope.$emit('clickedTile', {scope: $scope, item:item});
        }
      };
      $scope.$on('tilesChanged', (evt, $boardScope) => {
        $scope.isClickable = $boardScope.isTileFree(item);
      });
    }])
    .factory('Helpers', () => {
      return {
      };
    })
    .controller('BoardController', ['$scope','Helpers', ($scope, Helpers) => {
      var tilesOnStage  = [];
      $scope.tiles         = [];
      $scope.selectedTiles = [];
      $scope.width         = 30;
      $scope.height        = 16;
      $scope.depth         = 5;
      var isCoordValid = (i, j, k) => {
        return (i >= 0 && i < $scope.width) && (j >= 0 && j < $scope.height) && (k >= 0 && k < $scope.depth);
      };
      $scope.generate = () => {
        var tiles = [],i,j,k, tile;
        for (i = 0; i < $scope.width; i++) {
          tiles[i] = [];
          for (j = 0; j < $scope.height; j++) {
            tiles[i][j] = [];
            for (k = 0; k < $scope.depth; k++) {
              tiles[i][j][k] = undefined;
            }
          }
        }
        tilesOnStage.length = 0;
        Array.prototype.push.apply(tilesOnStage, tiles);
      };
      $scope.createLayout = () => {
        var i, j;
        for (i = 1; i <= 12; i++) {
          $scope.putTile(i * 2, 0 * 2, 0);
          $scope.putTile(i * 2, 3 * 2, 0);
          $scope.putTile(i * 2, 4 * 2, 0);
          $scope.putTile(i * 2, 7 * 2, 0);
        }
        for (i = 3; i <= 10; i++) {
          $scope.putTile(i * 2, 1 * 2, 0);
          $scope.putTile(i * 2, 6 * 2, 0);
        }
        for (i = 2; i <= 11; i++) {
          $scope.putTile(i * 2, 2 * 2, 0);
          $scope.putTile(i * 2, 5 * 2, 0);
        }
        $scope.putTile(0 * 2, 3 * 2 + 1, 0);
        $scope.putTile(13 * 2, 3 * 2 + 1, 0);
        $scope.putTile(14 * 2, 3 * 2 + 1, 0);
        for (i = 4; i <= 9; i++) {
          for (j = 1; j <= 6; j++) {
            $scope.putTile(i * 2, j * 2, 1);
          }
        }
        for (i = 5; i <= 8; i++) {
          for (j = 2; j <= 5; j++) {
            $scope.putTile(i * 2, j * 2, 2);
          }
        }
        for (i = 6; i <= 7; i++) {
          for (j = 3; j <= 4; j++) {
            $scope.putTile(i * 2, j * 2, 3);
          }
        }
        $scope.putTile(6 * 2 + 1, 3 * 2 + 1, 4);
      };
      $scope.randomizeLayout = () => {
        var N, idx, i, j, k;
        var tiles = tilesOnStage;
        var width = $scope.width;
        var height = $scope.height;
        var depth = $scope.depth;
        var count = 0;
        for (N = 1; N <= 34; N++) {
          for (idx = 0; idx < 4; idx++) {
            do {
              i = Math.floor((Math.random() * width));
              j = Math.floor((Math.random() * height));
              k = Math.floor((Math.random() * depth));
            } while (!tiles[i][j][k] || tiles[i][j][k] != -1);
            tiles[i][j][k] = {
              position: {x:i, y:j, z:k},
              tile: N,
              value: ++count
            };
          }
        }
        for (N = 35; N <= 42; N++) {
          do {
            i = Math.floor((Math.random() * width));
            j = Math.floor((Math.random() * height));
            k = Math.floor((Math.random() * depth));
          } while (!tiles[i][j][k] || tiles[i][j][k] != -1);
          tiles[i][j][k] = {
            position: {x:i, y:j, z:k},
            tile: N,
            value: ++count
          };
        }
      };
      $scope.putTile = (x,y,z) => {
        var tiles = tilesOnStage;
        tiles[x][y][z] = -1;
      };
      $scope.$on('clickedTile', (evt, data) => {
        var index = $scope.selectedTiles.indexOf(data.scope);
        if(index > -1) {
          $scope.selectedTiles.splice(index,1);
          data.scope.isSelected = false;
        } else {
          if($scope.selectedTiles.length < 2) {
            $scope.selectedTiles.push(data.scope);
            data.scope.isSelected = true;
          }
        }
        if($scope.selectedTiles.length === 2) {
          var tile1 = $scope.selectedTiles[0];
          var tile2 = $scope.selectedTiles[1];
          tile1.isSelected = false;
          tile2.isSelected = false;
          $scope.selectedTiles.length = 0;
          if($scope.areTilesEqual(tile1.tile, tile2.tile)) {
            var p1 = tile1.tile.position, p2 = tile2.tile.position;
            tilesOnStage[p1.x][p1.y][p1.z] = undefined;
            tilesOnStage[p2.x][p2.y][p2.z] = undefined;
            $scope.tiles.splice($scope.tiles.indexOf(tile1.tile), 1);
            $scope.tiles.splice($scope.tiles.indexOf(tile2.tile), 1);
          }
        }
      });
      $scope.$watch('tiles.length', (oldVal, newVal) => {
        $scope.$broadcast('tilesChanged', $scope);
      });
      $scope.initialize = () => {
        $scope.generate();
        $scope.createLayout();
        $scope.randomizeLayout();
        $scope.tiles.length = 0;
        for(var i = 0, len = tilesOnStage.length; i < len; i++) {
          for(var j = 0, jlen = tilesOnStage[i].length; j < jlen; j++) {
            for(var k = 0, klen = tilesOnStage[i][j].length; k < klen; k++) {
              if(tilesOnStage[i][j][k])
                $scope.tiles.push(tilesOnStage[i][j][k]);
            }
          }
        }
      };
      $scope.isTileFree = (tile) => {
        var i0, j0;
        var i = tile.position.x;
        var j = tile.position.y;
        var k = tile.position.z;
        var tiles = tilesOnStage;
        if (k < $scope.depth - 1) {
          for (i0 = -1; i0 <= 1; i0++) {
            for (j0 = -1; j0 <= 1; j0++) {
              if (isCoordValid(i + i0, j + j0, k + 1)) {
                if (tiles[i + i0][j + j0][k + 1])
                  return false;
              }
            }
          }
        }
        var hasLeft = false;
        var hasRight = false;
        for (j0 = -1; j0 <= 1; j0++) {
          if (isCoordValid(i - 2, j + j0, k)) {
            if (tiles[i - 2][j + j0][k]) {
              hasLeft = true;
            }
          }
          if (isCoordValid(i + 2, j + j0, k)) {
            if (tiles[i + 2][j + j0][k]) {
              hasRight = true;
            }
          }
        }
        if (hasLeft && hasRight)
          return false;
        return true;
      };
      $scope.areTilesEqual = (tile1, tile2) => {
        var t1 = tile1.tile;
        var t2 = tile2.tile;
        if (t1 < 35 && t2 < 35)
          return (t1 == t2);
        if (t1 >= 35 && t1 <= 38 && t2 >= 35 && t2 <= 38)
          return true;
        if (t1 >= 39 && t1 <= 42 && t2 >= 39 && t2 <= 42)
          return true;
        return false;
      };
    }]);
  </script>
</body>
</html>
