<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridlock Escape 3D - Precision Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @font-face {
            font-family: "Akedopikuseru";
            src: url("Akedopikuseru-Regular.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');

        html, body, * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #020617;
            font-family: 'Space Grotesk', sans-serif;
            padding-top: 60px;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 18px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 20;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #9eff8f;
            font-family: "Akedopikuseru", sans-serif;
        }

        .top-bar a {
            color: #63ff82;
            text-decoration: none;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            font-family: "Akedopikuseru", sans-serif;
        }

        #game-container {
            position: absolute;
            inset: 60px 0 0 0;
            width: 100%;
            height: calc(100% - 60px);
            overflow: hidden;
        }

        #win-screen {
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Gridlock Escape</h1>
        <a href="Files.html">Выход</a>
    </div>

    <div id="game-container"></div>

    <div class="ui-overlay">
        <div class="flex justify-between items-start">
            <div class="neo-glass p-5 rounded-2xl border-l-4 border-yellow-500">
                <h1 class="text-2xl font-bold tracking-tight">GRIDLOCK <span class="text-yellow-400">ESCAPE</span></h1>
                <p class="opacity-60 text-[10px] font-medium uppercase tracking-[0.2em]">Precision Engine v2.0</p>
            </div>
            <div class="flex flex-col gap-3 items-end">
                <div class="neo-glass px-5 py-2 rounded-xl text-sm font-bold flex gap-4">
                    <span>LEVEL: <span id="level-num" class="text-yellow-400">1</span></span>
                    <span>MOVES: <span id="move-count" class="text-yellow-400">0</span></span>
                </div>
                <button onclick="resetLevel()" class="btn-action interactive text-xs">
                    RESTART LEVEL
                </button>
            </div>
        </div>

        <div class="flex justify-center mb-4">
            <div class="neo-glass px-6 py-3 rounded-2xl text-[10px] font-bold border border-white/5 flex items-center gap-4">
                <span class="text-red-400">● SPORTS CAR (EXIT)</span>
                <span class="text-slate-400">● TRUCK (3x)</span>
                <span class="text-blue-400">● VAN (2x)</span>
                <span class="text-purple-400">● BUS (3x)</span>
            </div>
        </div>
    </div>

    <div id="win-screen" class="flex flex-col">
        <div class="neo-glass p-12 rounded-3xl text-center border border-white/10">
            <div class="text-yellow-400 text-sm font-bold mb-2 tracking-[0.3em] uppercase">Victory</div>
            <h2 class="text-5xl font-bold mb-6">EXIT CLEARED</h2>
            <div class="flex justify-center gap-12 mb-8 text-left">
                <div>
                    <div class="text-[10px] opacity-50 uppercase">Moves Taken</div>
                    <div id="win-moves" class="text-3xl font-bold">0</div>
                </div>
                <div>
                    <div class="text-[10px] opacity-50 uppercase">Status</div>
                    <div class="text-3xl font-bold text-green-400">EXPERT</div>
                </div>
            </div>
            <button id="next-btn" onclick="nextLevel()" class="btn-action px-12 py-4 text-lg rounded-xl interactive w-full">
                NEXT CHALLENGE
            </button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 6;
        const CELL_SIZE = 2.6;
        const OFFSET = (GRID_SIZE * CELL_SIZE) / 2 - (CELL_SIZE / 2);
        let scene, camera, renderer, raycaster, mouse;
        let cars = [];
        let selectedCar = null;
        let isDragging = false;
        let moveCount = 0;
        let dragPlane = new THREE.Plane();
        let intersection = new THREE.Vector3();
        let dragOffset = new THREE.Vector3();
        let initialPos = new THREE.Vector3();

        const levels = [
            {
                cars: [
                    { x: 0, y: 2, len: 2, dir: 'H', type: 'sports', color: 0xef4444, isPlayer: true },
                    { x: 2, y: 0, len: 3, dir: 'V', type: 'truck', color: 0x475569 },
                    { x: 3, y: 1, len: 2, dir: 'H', type: 'van', color: 0x3b82f6 },
                    { x: 3, y: 2, len: 2, dir: 'V', type: 'van', color: 0x10b981 },
                    { x: 0, y: 4, len: 3, dir: 'H', type: 'bus', color: 0x8b5cf6 },
                    { x: 4, y: 4, len: 2, dir: 'V', type: 'van', color: 0xf59e0b },
                ]
            },
            {
                cars: [
                    { x: 1, y: 2, len: 2, dir: 'H', type: 'sports', color: 0xef4444, isPlayer: true },
                    { x: 0, y: 0, len: 3, dir: 'V', type: 'truck', color: 0x4b5563 },
                    { x: 1, y: 0, len: 3, dir: 'H', type: 'bus', color: 0x8b5cf6 },
                    { x: 4, y: 0, len: 2, dir: 'V', type: 'van', color: 0x3b82f6 },
                    { x: 5, y: 0, len: 3, dir: 'V', type: 'truck', color: 0x1e293b },
                    { x: 2, y: 3, len: 3, dir: 'V', type: 'bus', color: 0xec4899 },
                    { x: 3, y: 3, len: 2, dir: 'H', type: 'van', color: 0xf59e0b },
                    { x: 4, y: 4, len: 2, dir: 'V', type: 'van', color: 0x10b981 },
                ]
            },
            {
                cars: [
                    { x: 0, y: 2, len: 2, dir: 'H', type: 'sports', color: 0xef4444, isPlayer: true },
                    { x: 2, y: 0, len: 2, dir: 'V', type: 'van', color: 0x3b82f6 },
                    { x: 3, y: 0, len: 3, dir: 'V', type: 'truck', color: 0x475569 },
                    { x: 4, y: 0, len: 2, dir: 'V', type: 'van', color: 0x3b82f6 },
                    { x: 5, y: 1, len: 3, dir: 'V', type: 'bus', color: 0x8b5cf6 },
                    { x: 0, y: 0, len: 2, dir: 'H', type: 'van', color: 0xf59e0b },
                    { x: 0, y: 1, len: 2, dir: 'H', type: 'van', color: 0x10b981 },
                    { x: 0, y: 3, len: 3, dir: 'V', type: 'bus', color: 0xec4899 },
                    { x: 1, y: 3, len: 3, dir: 'V', type: 'truck', color: 0x1e293b },
                    { x: 2, y: 4, len: 2, dir: 'H', type: 'van', color: 0xf59e0b },
                    { x: 4, y: 5, len: 2, dir: 'H', type: 'van', color: 0x3b82f6 },
                ]
            }
        ];
        let currentLevelIdx = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.Fog(0x020617, 20, 70);
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(18, 24, 18);
            camera.lookAt(0, -1, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            const container = document.getElementById('game-container');
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const direct = new THREE.DirectionalLight(0xffffff, 1.0);
            direct.position.set(15, 30, 15);
            direct.castShadow = true;
            direct.shadow.mapSize.width = 2048;
            direct.shadow.camera.left = -20;
            direct.shadow.camera.right = 20;
            direct.shadow.camera.top = 20;
            direct.shadow.camera.bottom = -20;
            scene.add(direct);
            setupEnvironment();
            loadLevel(currentLevelIdx);
            window.addEventListener('resize', onResize);
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchstart', (e) => onMouseDown(e.touches[0]));
            window.addEventListener('touchmove', (e) => onMouseMove(e.touches[0]));
            window.addEventListener('touchend', onMouseUp);
            animate();
        }

        function setupEnvironment() {
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            const gridHelper = new THREE.GridHelper(GRID_SIZE * CELL_SIZE, GRID_SIZE, 0x475569, 0x1e293b);
            gridHelper.position.y = 0.05;
            scene.add(gridHelper);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const s = GRID_SIZE * CELL_SIZE;
            const addWall = (w, h, d, x, z) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                mesh.position.set(x, h / 2, z);
                mesh.receiveShadow = true;
                scene.add(mesh);
            };
            const wThick = 0.8;
            addWall(s + wThick, 1.5, wThick, 0, -s / 2 - wThick / 2);
            addWall(wThick, 1.5, s + wThick, -s / 2 - wThick / 2, 0);
            addWall(s + wThick, 1.5, wThick, 0, s / 2 + wThick / 2);
            const exitY = 2;
            const segmentTop = (exitY * CELL_SIZE);
            const segmentBottom = s - ((exitY + 1) * CELL_SIZE);
            addWall(wThick, 1.5, segmentTop, s / 2 + wThick / 2, -s / 2 + segmentTop / 2);
            addWall(wThick, 1.5, segmentBottom, s / 2 + wThick / 2, s / 2 - segmentBottom / 2);
        }

        function createVehicle(len, dir, color, type) {
            const group = new THREE.Group();
            const PADDING = 0.4;
            const w = dir === 'H' ? len * CELL_SIZE - PADDING : CELL_SIZE - PADDING;
            const d = dir === 'V' ? len * CELL_SIZE - PADDING : CELL_SIZE - PADDING;
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.1, metalness: 0.9 });
            if (type === 'sports') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d), bodyMat);
                body.position.y = 0.35;
                body.castShadow = true;
                group.add(body);
                const cockpit = new THREE.Mesh(new THREE.BoxGeometry(w * 0.5, 0.3, d * 0.8), glassMat);
                cockpit.position.y = 0.65;
                group.add(cockpit);
                const spoiler = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, d * 0.9), bodyMat);
                spoiler.position.set(-w / 2 + 0.15, 0.8, 0);
                group.add(spoiler);
            } else if (type === 'truck') {
                const cabW = dir === 'H' ? w * 0.3 : w * 0.9;
                const cabD = dir === 'V' ? d * 0.3 : d * 0.9;
                const cab = new THREE.Mesh(new THREE.BoxGeometry(cabW, 1.2, cabD), bodyMat);
                cab.position.set(dir === 'H' ? w / 2 - cabW / 2 : 0, 1.0, dir === 'V' ? -d / 2 + cabD / 2 : 0);
                cab.castShadow = true;
                group.add(cab);
                const cargoW = dir === 'H' ? w * 0.65 : w * 0.85;
                const cargoD = dir === 'V' ? d * 0.65 : d * 0.85;
                const bed = new THREE.Mesh(new THREE.BoxGeometry(cargoW, 0.9, cargoD), new THREE.MeshStandardMaterial({ color: 0x334155 }));
                bed.position.set(dir === 'H' ? -w / 2 + cargoW / 2 + 0.1 : 0, 0.85, dir === 'V' ? d / 2 - cargoD / 2 - 0.1 : 0);
                group.add(bed);
            } else if (type === 'bus') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, 1.3, d), bodyMat);
                body.position.y = 0.8;
                body.castShadow = true;
                group.add(body);
                const winW = dir === 'H' ? w + 0.02 : w * 0.92;
                const winD = dir === 'V' ? d + 0.02 : d * 0.92;
                const wins = new THREE.Mesh(new THREE.BoxGeometry(winW, 0.4, winD), glassMat);
                wins.position.y = 1.0;
                group.add(wins);
            } else {
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, 1.1, d), bodyMat);
                body.position.y = 0.7;
                body.castShadow = true;
                group.add(body);
                const front = new THREE.Mesh(new THREE.BoxGeometry(w * 0.4, 0.4, d * 1.02), glassMat);
                front.position.set(dir === 'H' ? w / 2 - w * 0.2 : 0, 0.9, dir === 'V' ? -d / 2 + d * 0.2 : 0);
                group.add(front);
            }
            const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const addWheel = (lx, lz) => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(lx, 0.32, lz);
                group.add(wheel);
            };
            const wx = w / 2 - 0.5;
            const wz = d / 2 - 0.5;
            if (dir === 'H') {
                addWheel(wx, wz); addWheel(wx, -wz);
                addWheel(-wx, wz); addWheel(-wx, -wz);
                if (len > 2) { addWheel(0, wz); addWheel(0, -wz); }
            } else {
                addWheel(wx, wz); addWheel(-wx, wz);
                addWheel(wx, -wz); addWheel(-wx, -wz);
                if (len > 2) { addWheel(wx, 0); addWheel(-wx, 0); }
            }
            return group;
        }

        function loadLevel(idx) {
            cars.forEach(c => scene.remove(c.mesh));
            cars = [];
            moveCount = 0;
            document.getElementById('move-count').innerText = "0";
            document.getElementById('level-num').innerText = (idx + 1);
            hideWin();
            const level = levels[idx];
            level.cars.forEach(config => {
                const mesh = createVehicle(config.len, config.dir, config.color, config.type);
                const centerX = (config.x * CELL_SIZE) - OFFSET + ((config.dir === 'H' ? config.len : 1) * CELL_SIZE / 2) - (CELL_SIZE / 2);
                const centerZ = (config.y * CELL_SIZE) - OFFSET + ((config.dir === 'V' ? config.len : 1) * CELL_SIZE / 2) - (CELL_SIZE / 2);
                mesh.position.set(centerX, 0, centerZ);
                scene.add(mesh);
                cars.push({ ...config, mesh: mesh });
            });
        }

        function onMouseDown(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cars.map(c => c.mesh), true);
            if (intersects.length > 0) {
                let hit = intersects[0].object;
                while (hit.parent && !cars.find(c => c.mesh === hit)) hit = hit.parent;
                selectedCar = cars.find(c => c.mesh === hit);
                if (selectedCar) {
                    isDragging = true;
                    initialPos.copy(selectedCar.mesh.position);
                    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), selectedCar.mesh.position);
                    if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
                        dragOffset.copy(intersection).sub(selectedCar.mesh.position);
                    }
                }
            }
        }

        function onMouseMove(event) {
            if (!isDragging || !selectedCar) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
                let target = intersection.clone().sub(dragOffset);
                if (selectedCar.dir === 'H') {
                    target.z = initialPos.z;
                    target.x = getValidPosition(selectedCar, target.x, 'x');
                } else {
                    target.x = initialPos.x;
                    target.z = getValidPosition(selectedCar, target.z, 'z');
                }
                selectedCar.mesh.position.copy(target);
            }
        }

        function getValidPosition(car, requested, axis) {
            const halfLen = (car.len * CELL_SIZE) / 2;
            const minBound = -OFFSET - (CELL_SIZE / 2);
            const maxBound = OFFSET + (CELL_SIZE / 2);
            let clamped = Math.max(minBound + halfLen, Math.min(maxBound - halfLen, requested));
            if (car.isPlayer && car.dir === 'H' && requested > maxBound - halfLen) {
                clamped = requested;
            }
            for (const other of cars) {
                if (other === car) continue;
                const otherHalfW = (other.dir === 'H' ? other.len : 1) * CELL_SIZE / 2;
                const otherHalfD = (other.dir === 'V' ? other.len : 1) * CELL_SIZE / 2;
                const oMinX = other.mesh.position.x - otherHalfW + 0.05;
                const oMaxX = other.mesh.position.x + otherHalfW - 0.05;
                const oMinZ = other.mesh.position.z - otherHalfD + 0.05;
                const oMaxZ = other.mesh.position.z + otherHalfD - 0.05;
                const myHalfW = (car.dir === 'H' ? car.len : 1) * CELL_SIZE / 2;
                const myHalfD = (car.dir === 'V' ? car.len : 1) * CELL_SIZE / 2;
                if (axis === 'x') {
                    const myZmin = car.mesh.position.z - myHalfD + 0.05;
                    const myZmax = car.mesh.position.z + myHalfD - 0.05;
                    if (myZmin < oMaxZ && myZmax > oMinZ) {
                        if (clamped + myHalfW > oMinX && initialPos.x < other.mesh.position.x) {
                            clamped = oMinX - myHalfW;
                        }
                        if (clamped - myHalfW < oMaxX && initialPos.x > other.mesh.position.x) {
                            clamped = oMaxX + myHalfW;
                        }
                    }
                } else {
                    const myXmin = car.mesh.position.x - myHalfW + 0.05;
                    const myXmax = car.mesh.position.x + myHalfW - 0.05;
                    if (myXmin < oMaxX && myXmax > oMinX) {
                        if (clamped + myHalfD > oMinZ && initialPos.z < other.mesh.position.z) {
                            clamped = oMinZ - myHalfD;
                        }
                        if (clamped - myHalfD < oMaxZ && initialPos.z > other.mesh.position.z) {
                            clamped = oMaxZ + myHalfD;
                        }
                    }
                }
            }
            return clamped;
        }

        function onMouseUp() {
            if (isDragging && selectedCar) {
                const localX = selectedCar.mesh.position.x + OFFSET;
                const localZ = selectedCar.mesh.position.z + OFFSET;
                let snapX, snapZ;
                if (selectedCar.dir === 'H') {
                    const gridX = Math.round((localX - (selectedCar.len * CELL_SIZE / 2) + CELL_SIZE / 2) / CELL_SIZE);
                    snapX = (gridX * CELL_SIZE) - OFFSET + (selectedCar.len * CELL_SIZE / 2) - CELL_SIZE / 2;
                    snapZ = initialPos.z;
                } else {
                    const gridY = Math.round((localZ - (selectedCar.len * CELL_SIZE / 2) + CELL_SIZE / 2) / CELL_SIZE);
                    snapZ = (gridY * CELL_SIZE) - OFFSET + (selectedCar.len * CELL_SIZE / 2) - CELL_SIZE / 2;
                    snapX = initialPos.x;
                }
                if (selectedCar.isPlayer && selectedCar.mesh.position.x > OFFSET + CELL_SIZE) {
                    snapX = selectedCar.mesh.position.x + 10;
                }
                gsap.to(selectedCar.mesh.position, {
                    x: snapX, z: snapZ, duration: 0.25, ease: "power2.out",
                    onComplete: checkWin
                });
                if (Math.abs(selectedCar.mesh.position.x - initialPos.x) > 0.5 || Math.abs(selectedCar.mesh.position.z - initialPos.z) > 0.5) {
                    moveCount++;
                    document.getElementById('move-count').innerText = moveCount;
                }
            }
            isDragging = false;
            selectedCar = null;
        }

        function checkWin() {
            const player = cars.find(c => c.isPlayer);
            if (player && player.mesh.position.x > OFFSET + (CELL_SIZE * 1.5)) {
                document.getElementById('win-moves').innerText = moveCount;
                showWin();
            }
        }

        function showWin() {
            const win = document.getElementById('win-screen');
            win.style.display = 'flex';
            gsap.to(win, { opacity: 1, pointerEvents: 'auto', duration: 0.5 });
            if (currentLevelIdx === levels.length - 1) {
                document.getElementById('next-btn').innerText = "REPLAY ALL";
            }
        }

        function hideWin() {
            const win = document.getElementById('win-screen');
            gsap.to(win, { opacity: 0, pointerEvents: 'none', duration: 0.2, onComplete: () => win.style.display = 'none' });
        }

        function nextLevel() {
            currentLevelIdx = (currentLevelIdx + 1) % levels.length;
            loadLevel(currentLevelIdx);
        }

        function resetLevel() {
            loadLevel(currentLevelIdx);
        }

        function onResize() {
            const container = document.getElementById('game-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
